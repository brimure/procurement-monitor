name: Daily Africa Procurement Monitor

on:
  schedule:
    # Runs automatically every day at 06:00 AM UTC
    - cron: '0 6 * * *'
  # Allows triggering the scraper manually via a button in GitHub
  workflow_dispatch:

jobs:
  harvest-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Execute Procurement Harvester
        run: |
          python harvester.py

      - name: Commit and Push Updated Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/tenders.json procurement_leads.db
          git commit -m "Auto-update procurement leads: $(date -u)" || exit 0
          git push